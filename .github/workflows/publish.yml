name: Publish to npm
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC): no stored npm token. Needs npm >= 11.5.1 and the
      # trusted publisher configured on npmjs.com (Anonyfox/celestine, publish.yml).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance --access public
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
